name: Farm workspace portability
on:
  push:
    paths:
      - 'nexus/farm_app/**'
      - 'docs/development/**'
      - '.github/workflows/farm-workspace.yml'
  pull_request:
    paths:
      - 'nexus/farm_app/**'
      - 'docs/development/**'
      - '.github/workflows/farm-workspace.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  farm-workspace:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run standard-library workspace tests
        run: python -m unittest discover -s nexus/farm_app -t .
      - name: Check modified browser scripts
        run: |
          node --check nexus/farm_app/resource_workspace.js
          node --check nexus/farm_app/form_safety.js
          node --check nexus/farm_app/account_pilot.js
          node --check nexus/farm_app/account_admin.js
          node --check nexus/farm_app/authenticated_workspace.js
          node --check nexus/farm_app/authenticated_inspections.js
          node --check nexus/farm_app/page_guides.js
      - name: Check form safety helpers
        run: node nexus/farm_app/test_form_safety.cjs
      - name: Smoke test combined routes on an isolated database
        run: python -m nexus.farm_app.smoke_workspace

  authenticated-core-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify core access and existing workspace
        run: python -m unittest discover -s nexus/farm_app -t .
      - name: Check protected workspace JavaScript
        run: |
          node --check nexus/farm_app/authenticated_workspace.js
          node --check nexus/farm_app/authenticated_inspections.js
      - name: Verify existing combined routes
        run: python -m nexus.farm_app.smoke_workspace
      - name: Package checked source-only updater
        run: python nexus/farm_app/package_authenticated.py
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-inspection-reliability
          path: dist/nexus-inspection-reliability/
          if-no-files-found: error
          retention-days: 30


  inspection-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/nexus-browser" --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/nexus-browser/node_modules/.bin/playwright" install --with-deps chromium --only-shell
      - name: Exercise authenticated inspection workflow in Chromium
        run: NODE_PATH="$RUNNER_TEMP/nexus-browser/node_modules" python -m nexus.farm_app.smoke_inspection_browser
